context:
  version: "1.43.2"

recipe:
  name: polars
  version: ${{ version }}

source:
  - if: polars_runtime == '32'
    then:
      - if: target_platform == 'linux-64'
        then:
          - url: https://pypi.org/packages/source/p/polars/polars-${{ version }}.tar.gz
            sha256: c699671b99eb71ff53334d237917aaa3db5ad4dda480abcb6c80e0eaee7b677b
            target_directory: polars-python
      - url: https://pypi.org/packages/source/p/polars-runtime-32/polars_runtime_32-${{ version }}.tar.gz
        sha256: d7b7c486bccee75a6af0158b87077da3d054657e3c60036b28644f4e1c7fdbf7
        target_directory: polars-runtime-32
  - if: polars_runtime == '64'
    then:
      url: https://pypi.org/packages/source/p/polars-runtime-64/polars_runtime_64-${{ version }}.tar.gz
      sha256: 096eb2817d3ff566508883e66acb95cc54a0480976a00b822d669a738854ad13
      target_directory: polars-runtime-64
  - if: polars_runtime == 'compat'
    then:
      url: https://pypi.org/packages/source/p/polars-runtime-compat/polars_runtime_compat-${{ version }}.tar.gz
      sha256: d5872963e22bba149b7f8c892ed0037ee80078d42410aef4fa869786ac46a8e8
      target_directory: polars-runtime-compat

build:
  number: 0

outputs:
  - package:
      name: polars-runtime-${{ polars_runtime }}
    build:
      script:
        file: build_polars_runtime
      skip: is_abi3 and not is_python_min
      python:
        version_independent: ${{ is_abi3 }}
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - crossenv
            - maturin >=1.3.2,<2
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('rust') }}
        - cargo-auditable
        - if: build_platform == 'win-64'
          then:
            - m2-base
        - cmake
        - if: unix
          then:
            - make
        - cargo-bundle-licenses
      host:
        - python
        - if: is_abi3
          then:
            - python-abi3
        - pip
        - maturin >=1.3.2,<2
      run:
        - python
      ignore_run_exports:
        from_package:
          - cross-python_${{ target_platform }}
    tests:
      - python:
          pip_check: true
          imports:
            - _polars_runtime_${{ polars_runtime }}
          python_version:
            - if: is_abi3
              then: ${{ python_min }}.*
            - "*"
      - package_contents:
          site_packages:
            - _polars_runtime_${{ polars_runtime }}/__init__.py
            - if: is_abi3
              then: _polars_runtime_${{ polars_runtime }}/_polars_runtime.${{ 'abi3.so' if unix else 'pyd' }}
              else: _polars_runtime_${{ polars_runtime }}/_polars_runtime.${{ '*.so' if unix else '*.pyd' }}
            - polars_runtime_${{ polars_runtime }}-${{ version }}.dist-info/*
      - if: is_abi3
        then:
          requirements:
            run:
              - abi3audit
          script:
            - if: unix
              then:
                abi3audit $SP_DIR/_polars_runtime_${{ polars_runtime }}/_polars_runtime.abi3.so -s -v
                --assume-minimum-abi3 ${{ python_min }}
              else:
                abi3audit %SP_DIR%\_polars_runtime_${{ polars_runtime }}\_polars_runtime.pyd -s -v
                --assume-minimum-abi3 ${{ python_min }}
    about:
      license_file:
        - polars-runtime-${{ polars_runtime }}/LICENSE
        - polars-runtime-${{ polars_runtime }}/THIRDPARTY.yml

  - package:
      name: polars
    build:
      noarch: python
      script: |
        cd polars-python
        $PYTHON -m pip install . -vv
      skip: not (polars_runtime == "32" and target_platform == "linux-64" and is_abi3 and is_python_min)
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - setuptools
      run:
        - polars-runtime-32 ==${{ version }}
        - python >=${{ python_min }}
      run_constraints:
        - numpy >=1.16.0
        - pyarrow >=7.0.0
        - fastexcel >=0.9
        - openpyxl >=3.0.0
        - xlsx2csv >=0.8.0
        - connectorx >=0.3.2
        - deltalake >=1.0.0
        - pyiceberg >=0.7.1
        - altair >=5.4.0
        - great_tables >=0.8.0
        - polars-runtime-32 ==${{ version }}
        - polars-runtime-64 ==${{ version }}
        - polars-runtime-compat ==${{ version }}
    tests:
      - python:
          pip_check: true
          imports:
            - polars
          python_version: ${{ python_min }}.*
      - script:
          - python -c 'from polars import DataFrame'
          - python -c 'import polars; polars.show_versions()'
      - package_contents:
          site_packages:
            - polars/dataframe/__init__.py
            - polars-${{ version }}.dist-info/*
    about:
      license_file: polars-python/LICENSE

about:
  homepage: https://github.com/pola-rs/polars
  license: MIT
  license_file:
    - polars-runtime-${{ polars_runtime }}/LICENSE
    - polars-runtime-${{ polars_runtime }}/THIRDPARTY.yml
  summary: Dataframes powered by a multithreaded, vectorized query engine, written in Rust
  description:
    Polars is a DataFrame interface on top of an OLAP Query Engine implemented in Rust using Apache Arrow Columnar
    Format as the memory model.
  documentation: https://docs.pola.rs
  repository: https://github.com/pola-rs/polars

extra:
  recipe-maintainers:
    - borchero
    - Maxyme
    - timkpaine
    - ritchie46
    - sugatoray
    - xhochy
    - dhirschfeld
    - pavelzw
    - "0xbe7a"
